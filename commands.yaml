fix:
  script: dart fix --apply

format: 
  script: dart format . ...args

analyze: 
  script: dart analyze

run:
  switch:
    docs:
      script: |
        cd website
        cp ../CHANGELOG.md ./src/pages/changelog.md
        npm run start
    tests:
      script: |
        dart test --test-randomize-ordering-seed=random
        cd example && dart test

push:
  script: git push ...args
