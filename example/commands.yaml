## ============================================================================
## PRESERVED COMMANDS (DO NOT MODIFY)
## ============================================================================
hello: ## Prints "Hello World"
  script: echo "Hello World"

d:
  script: |
    dart ...args

test:
  override: false
  script: |
    echo "test overridden"

make:
  override: true
  script: |
    echo "make overridden"          

invalid!:

invalid_quoted_boolean: ## Invalid: quoted default with explicit boolean type
  script: echo "This should not work"
  params:
    optional:
      - port: '-p, --port'
        type: boolean
        default: "3000"

invalid_string_boolean: ## Invalid: string default with explicit boolean type
  script: echo "This should not work"
  params:
    optional:
      - port: '-p, --port'
        type: boolean
        default: text

invalid_integer_boolean: ## Invalid: integer default with explicit boolean type
  script: echo "This should not work"
  params:
    optional:
      - port: '-p, --port'
        type: boolean
        default: 1

invalid_double_boolean: ## Invalid: double default with explicit boolean type
  script: echo "This should not work"
  params:
    optional:
      - port: '-p, --port'
        type: boolean
        default: 2.5        

invalid_quoted_integer: ## Invalid: quoted default with explicit integer type
  script: echo "This should not work"
  params:
    optional:
      - port: '-p, --port'
        type: int
        default: "3000"

invalid_double_integer: ## Invalid: double default with explicit integer type
  script: echo "This should not work"
  params:
    optional:
      - port: '-p, --port'
        type: integer
        default: 2.0

invalid_boolean_integer: ## Invalid: boolean default with explicit integer type
  script: echo "This should not work"
  params:
    optional:
      - port: '-p, --port'
        type: integer
        default: true

invalid_quoted_double: ## Invalid: quoted default with explicit double type
  script: echo "This should not work"
  params:
    optional:
      - timeout: '-t, --timeout'
        type: double
        default: "30.0"

invalid_boolean_double: ## Invalid: boolean default with explicit double type
  script: echo "This should not work"
  params:
    optional:
      - timeout: '-t, --timeout'
        type: double
        default: true

invalid_integer_double: ## Invalid: integer default with explicit double type
  script: echo "This should not work"
  params:
    optional:
      - timeout: '-t, --timeout'
        type: double
        default: 1            

invalid_integer_string: ## Invalid: explicit string type with unquoted integer default
  script: echo "This should not work"
  params:
    optional:
      - code: '-c, --code'
        type: string
        default: 123

invalid_double_string: ## Invalid: explicit string type with unquoted double default
  script: echo "This should not work"
  params:
    optional:
      - version: '-v, --version'
        type: string
        default: 1.5

invalid_boolean_string: ## Invalid: boolean default with explicit string type
  script: echo "This should not work"
  params:
    optional:
      - timeout: '-t, --timeout'
        type: string
        default: true        

invalid_script_and_switch: ## Invalid: has both script and switch defined
  script: echo "This should not work"
  switch:
    - opt1:
      script: echo "Option 1"
    - opt2:
      script: echo "Option 2"
    - default: opt1

invalid_typed_enum_integer_string: ## Invalid: integer enum with string value
  script: echo "This should not work"
  params:
    required:
      - platform:
        type: integer
        values: [text, 1, 2]

invalid_typed_enum_int_default_string: ## Invalid: integer enum with string default
  script: echo "This should not work"
  params:
    required:
      - platform:
        type: integer
        values: [1, 2, 3]
        default: text

invalid_typed_enum_integer_double: ## Invalid: integer enum with double value
  script: echo "This should not work"
  params:
    required:
      - platform:
        type: integer
        values: [3.3, 1, 2]

invalid_typed_enum_int_default_double: ## Invalid: integer enum with double default
  script: echo "This should not work"
  params:
    required:
      - platform:
        type: integer
        values: [1, 2, 3]
        default: 2.5        
