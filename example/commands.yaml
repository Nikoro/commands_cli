## ============================================================================
## PRESERVED COMMANDS (DO NOT MODIFY)
## ============================================================================
hello: ## Prints "Hello World"
  script: echo "Hello World"

d:
  script: |
    dart ...args

test:
  override: false
  script: |
    echo "test overridden"

make:
  override: true
  script: |
    echo "make overridden"          

invalid!:

invalid_quoted_int: ## Invalid: quoted default with explicit int type
  script: echo "port={port}"
  params:
    optional:
      - port: '-p, --port'
        type: int
        default: "3000"

invalid_quoted_double: ## Invalid: quoted default with explicit double type
  script: echo "timeout={timeout}"
  params:
    optional:
      - timeout: '-t, --timeout'
        type: double
        default: "30.0"

invalid_string_int: ## Invalid: explicit string type with unquoted int default
  script: echo "code={code}"
  params:
    optional:
      - code: '-c, --code'
        type: string
        default: 123

invalid_string_double: ## Invalid: explicit string type with unquoted double default
  script: echo "version={version}"
  params:
    optional:
      - version: '-v, --version'
        type: string
        default: 1.5

invalid_script_and_switch: ## Invalid: has both script and switch defined
  script: echo "This should not work"
  switch:
    - opt1:
      script: echo "Option 1"
    - opt2:
      script: echo "Option 2"
    - default: opt1

## ============================================================================
## LEVEL 9: Nested Switches - Simple (1 Level Deep)
## ============================================================================

nest1_default_no_comment:
  switch:
    - parent1:
      switch:
        - child1:
          script: echo "Parent1 Child1"
        - child2:
          script: echo "Parent1 Child2"
        - default: child1
    - parent2:
      switch:
        - child1:
          script: echo "Parent2 Child1"
        - child2:
          script: echo "Parent2 Child2"
        - default: child2
    - default: parent1

nest2_default_with_comment: ## Nested switches with comments
  switch:
    - parent1: ## First parent
      switch:
        - child1: ## First child
          script: echo "Parent1 Child1"
        - child2: ## Second child
          script: echo "Parent1 Child2"
        - default: child1
    - parent2: ## Second parent
      switch:
        - child1: ## First child
          script: echo "Parent2 Child1"
        - child2: ## Second child
          script: echo "Parent2 Child2"
        - default: child2
    - default: parent2

nest3_menu_no_comment:
  switch:
    - parent1:
      switch:
        - child1:
          script: echo "Menu Parent1 Child1"
        - child2:
          script: echo "Menu Parent1 Child2"
    - parent2:
      switch:
        - child1:
          script: echo "Menu Parent2 Child1"
        - child2:
          script: echo "Menu Parent2 Child2"

nest4_menu_with_comment: ## Nested interactive menu with comments
  switch:
    - parent1: ## First parent
      switch:
        - child1: ## First child
          script: echo "Menu Parent1 Child1"
        - child2: ## Second child
          script: echo "Menu Parent1 Child2"
    - parent2: ## Second parent
      switch:
        - child1: ## First child
          script: echo "Menu Parent2 Child1"
        - child2: ## Second child
          script: echo "Menu Parent2 Child2"

## ============================================================================
## LEVEL 10: Nested Switches with Params (NAMED)
## ============================================================================

nest5_default_named_params_no_comment:
  switch:
    - parent1:
      switch:
        - child1:
          script: |
            echo "P1C1: {val}"
          params:
            optional:
              - val: '-v, --value'
                default: "p1c1"
        - child2:
          script: |
            echo "P1C2: {val}"
          params:
            optional:
              - val: '-v, --value'
                default: "p1c2"
        - default: child1
    - default: parent1

nest6_default_named_params_with_comment: ## Nested with named params all commented
  switch:
    - parent1: ## First parent
      switch:
        - child1: ## First child
          script: |
            echo "P1C1: {val}"
          params:
            optional:
              - val: '-v, --value' ## Value param
                default: "p1c1"
        - child2: ## Second child
          script: |
            echo "P1C2: {val}"
          params:
            optional:
              - val: '-v, --value' ## Value param
                default: "p1c2"
        - default: child2
    - default: parent1

nest7_menu_named_params_mixed: ## Nested menu with mixed named params and comments
  switch:
    - parent1: ## First parent with required param
      switch:
        - child1:
          script: |
            echo "P1C1: {req}"
          params:
            required:
              - req: '-r, --required' ## Required param
        - child2: ## Second child with optional param
          script: |
            echo "P1C2: {opt}"
          params:
            optional:
              - opt: '-o, --optional'
                default: "p1c2opt"
    - parent2:
      switch:
        - child1: ## Child without params
          script: echo "P2C1"
        - child2:
          script: |
            echo "P2C2: {val}"
          params:
            optional:
              - val: '-v, --value'
                default: "p2c2"

## ============================================================================
## LEVEL 10b: Nested Switches with Params (POSITIONAL)
## ============================================================================

nest5_default_positional_params_no_comment:
  switch:
    - parent1:
      switch:
        - child1:
          script: |
            echo "P1C1: {val}"
          params:
            optional:
              - val:
                default: "p1c1"
        - child2:
          script: |
            echo "P1C2: {val}"
          params:
            optional:
              - val:
                default: "p1c2"
        - default: child1
    - default: parent1

nest6_default_positional_params_with_comment: ## Nested with positional params all commented
  switch:
    - parent1: ## First parent
      switch:
        - child1: ## First child
          script: |
            echo "P1C1: {val}"
          params:
            optional:
              - val: ## Value param
                default: "p1c1"
        - child2: ## Second child
          script: |
            echo "P1C2: {val}"
          params:
            optional:
              - val: ## Value param
                default: "p1c2"
        - default: child2
    - default: parent1

nest7_menu_positional_params_mixed: ## Nested menu with mixed positional params and comments
  switch:
    - parent1: ## First parent with required param
      switch:
        - child1:
          script: |
            echo "P1C1: {req}"
          params:
            required:
              - req: ## Required param
        - child2: ## Second child with optional param
          script: |
            echo "P1C2: {opt}"
          params:
            optional:
              - opt:
                default: "p1c2opt"
    - parent2:
      switch:
        - child1: ## Child without params
          script: echo "P2C1"
        - child2:
          script: |
            echo "P2C2: {val}"
          params:
            optional:
              - val:
                default: "p2c2"

## ============================================================================
## LEVEL 10c: Nested Switches with Params (MIXED NAMED/POSITIONAL)
## ============================================================================

nest8_hybrid_params: ## Nested with mixed named/positional params
  switch:
    - parent1: ## Parent with named params
      switch:
        - child1: ## Named required
          script: |
            echo "P1C1: {req}"
          params:
            required:
              - req: '-r, --required' ## Named required param
        - child2: ## Positional optional
          script: |
            echo "P1C2: {opt}"
          params:
            optional:
              - opt: ## Positional optional param
                default: "p1c2"
        - default: child1
    - parent2: ## Parent with positional params
      switch:
        - child1: ## Positional required
          script: |
            echo "P2C1: {req}"
          params:
            required:
              - req: ## Positional required param
        - child2: ## Named optional
          script: |
            echo "P2C2: {opt}"
          params:
            optional:
              - opt: '-o, --optional' ## Named optional param
                default: "p2c2"
        - default: child2
    - default: parent1

## ============================================================================
## LEVEL 11: Deeply Nested Switches (2+ Levels)
## ============================================================================

nest8_deep_default: ## 2-level nested with defaults
  switch:
    - level1:
      switch:
        - level2a:
          switch:
            - level3a:
              script: echo "L1 L2a L3a"
            - level3b:
              script: echo "L1 L2a L3b"
            - default: level3a
        - level2b:
          switch:
            - level3a:
              script: echo "L1 L2b L3a"
            - level3b:
              script: echo "L1 L2b L3b"
            - default: level3b
        - default: level2a
    - default: level1

nest9_deep_menu: ## 2-level nested interactive menu
  switch:
    - level1:
      switch:
        - level2a:
          switch:
            - level3a:
              script: echo "Menu L1 L2a L3a"
            - level3b:
              script: echo "Menu L1 L2a L3b"
        - level2b:
          switch:
            - level3a:
              script: echo "Menu L1 L2b L3a"
            - level3b:
              script: echo "Menu L1 L2b L3b"

nest10_deep_mixed_named: ## 2-level nested mixed defaults/menus with named params
  switch:
    - level1: ## First level1
      switch:
        - level2a: ## Has default
          switch:
            - level3a: ## With named param
              script: |
                echo "L1 L2a L3a: {val}"
              params:
                optional:
                  - val: '-v, --value'
                    default: "l3a"
            - level3b:
              script: echo "L1 L2a L3b"
            - default: level3a
        - level2b: ## No default (menu)
          switch:
            - level3a:
              script: echo "L1 L2b L3a"
            - level3b:
              script: echo "L1 L2b L3b"
        - default: level2a
    - default: level1

nest10_deep_mixed_positional: ## 2-level nested mixed defaults/menus with positional params
  switch:
    - level1: ## First level1
      switch:
        - level2a: ## Has default
          switch:
            - level3a: ## With positional param
              script: |
                echo "L1 L2a L3a: {val}"
              params:
                optional:
                  - val: ## Positional value param
                    default: "l3a"
            - level3b:
              script: echo "L1 L2a L3b"
            - default: level3a
        - level2b: ## No default (menu)
          switch:
            - level3a:
              script: echo "L1 L2b L3a"
            - level3b:
              script: echo "L1 L2b L3b"
        - default: level2a
    - default: level1

nest11_deep_hybrid: ## 2-level nested with mixed named/positional params
  switch:
    - level1: ## First level1 with named params
      switch:
        - level2a: ## Has default with named req param
          switch:
            - level3a: ## Named required
              script: |
                echo "L1 L2a L3a: {req}"
              params:
                required:
                  - req: '-r, --required' ## Named required param
            - level3b: ## Named optional
              script: |
                echo "L1 L2a L3b: {opt}"
              params:
                optional:
                  - opt: '-o, --optional' ## Named optional param
                    default: "l3b"
            - default: level3a
        - level2b: ## Positional params
          switch:
            - level3a: ## Positional required
              script: |
                echo "L1 L2b L3a: {req}"
              params:
                required:
                  - req: ## Positional required param
            - level3b: ## Positional optional
              script: |
                echo "L1 L2b L3b: {opt}"
              params:
                optional:
                  - opt: ## Positional optional param
                    default: "l3b"
        - default: level2a
    - default: level1

## ============================================================================
## PARAMETER TYPE SYSTEM TESTS
## ============================================================================

type_bool_flags: ## Test boolean flags
  script: echo "verbose={verbose} debug={debug}"
  params:
    optional:
      - verbose: '-v, --verbose'
        default: false
      - debug: '-d, --debug'
        default: true

type_enum_with_default: ## Test enum with default
  script: echo "env={env}"
  params:
    optional:
      - env: '-e, --environment'
        values: [dev, staging, prod]
        default: staging

type_enum_no_default: ## Test enum without default (picker)
  script: echo "target={target}"
  params:
    optional:
      - target: '-t, --target'
        description: 'Select target'
        values: [ios, android, web]

type_numeric_types: ## Test int and double
  script: echo "port={port} timeout={timeout}"
  params:
    optional:
      - port: '-p, --port'
        type: int
        default: 3000
      - timeout: '--timeout'
        type: double
        default: 30.0

type_mixed_types: ## Test all types together
  script: echo "env={env} replicas={replicas} timeout={timeout} verbose={verbose}"
  params:
    optional:
      - env: '-e, --environment'
        values: [dev, staging, prod]
        default: staging
      - replicas: '-r, --replicas'
        type: int
        default: 3
      - timeout: '-t, --timeout'
        type: double
        default: 30.5
      - verbose: '-v, --verbose'
        default: false

type_inferred_int: ## Test inferred int type
  script: echo "port={port} workers={workers}"
  params:
    optional:
      - port: '-p, --port'
        default: 8080
      - workers: '-w, --workers'
        default: 4

type_inferred_double: ## Test inferred double type
  script: echo "ratio={ratio} timeout={timeout}"
  params:
    optional:
      - ratio: '-r, --ratio'
        default: 0.5
      - timeout: '-t, --timeout'
        default: 30.0

type_inferred_boolean: ## Test inferred boolean type
  script: echo "enabled={enabled} verbose={verbose}"
  params:
    optional:
      - enabled: '-e, --enabled'
        default: true
      - verbose: '-v, --verbose'
        default: false

type_inferred_string: ## Test inferred string type
  script: echo "name={name} message={message}"
  params:
    optional:
      - name: '-n, --name'
        default: example
      - message: '-m, --message'
        default: hello world

type_inferred_mixed: ## Test all inferred types together
  script: echo "port={port} ratio={ratio} enabled={enabled} name={name}"
  params:
    optional:
      - port: '-p, --port'
        default: 3000
      - ratio: '-r, --ratio'
        default: 1.5
      - enabled: '-e, --enabled'
        default: true
      - name: '-n, --name'
        default: server

type_quoted_int: ## Test quoted int becomes string
  script: echo "port={port} count={count}"
  params:
    optional:
      - port: '-p, --port'
        default: "8080"
      - count: '-c, --count'
        default: '42'

type_quoted_double: ## Test quoted double becomes string
  script: echo "ratio={ratio} timeout={timeout}"
  params:
    optional:
      - ratio: '-r, --ratio'
        default: "0.75"
      - timeout: '-t, --timeout'
        default: '30.0'

type_quoted_boolean: ## Test quoted boolean becomes string
  script: echo "enabled={enabled} verbose={verbose}"
  params:
    optional:
      - enabled: '-e, --enabled'
        default: "true"
      - verbose: '-v, --verbose'
        default: 'false'

type_quoted_inferred: ## Test quoted values become strings
  script: echo "port={port} ratio={ratio}"
  params:
    optional:
      - port: '-p, --port'
        default: "9000"
      - ratio: '-r, --ratio'
        default: '2.5'

type_explicit_string: ## Test explicit string type prevents inference
  script: echo "code={code} version={version}"
  params:
    required:
      - code: '-c, --code'
        type: string
      - version: '-v, --version'
        type: string

type_enum_required_positional: ## Test required positional enum without default
  script: echo "platform={platform}"
  params:
    required:
      - platform:
        values: [Alpha, Bravo, Charlie]

type_enum_required_named: ## Test required named enum without default (picker)
  script: echo "platform={platform}"
  params:
    required:
      - platform: '-p, --platform'
        values: [ios, android, web]

type_enum_optional_named: ## Test optional named enum without default (no picker)
  script: echo "platform={platform}"
  params:
    optional:
      - platform: '-p, --platform'
        values: [ios, android, web]

type_enum_optional_positional: ## Test optional positional enum without default (no picker)
  script: echo "env={env}"
  params:
    optional:
      - env:
        values: [dev, staging, prod]

## ============================================================================
## TYPED ENUM TESTS
## ============================================================================

# Valid typed enum - all values are integers
type_enum_int_valid: ## Test typed enum with valid int values
  script: echo "level={level}"
  params:
    required:
      - level: '-l, --level'
        type: int
        values: [1, 2, 3]
        default: 1

# Valid typed enum - string type (explicit)
type_enum_string_explicit: ## Test typed enum with explicit string type
  script: echo "platform={platform}"
  params:
    required:
      - platform: '-p, --platform'
        type: string
        values: [ios, android, web]
        default: ios

# Valid typed enum - double type with integers (coercion)
type_enum_double_with_int: ## Test typed enum double accepts integers
  script: echo "ratio={ratio}"
  params:
    optional:
      - ratio: '-r, --ratio'
        type: double
        values: [1, 2, 3]
        default: 1

# Valid typed enum - int type with whole number doubles
type_enum_int_with_whole_doubles: ## Test typed enum int accepts whole doubles
  script: echo "count={count}"
  params:
    optional:
      - count: '-c, --count'
        type: int
        values: [1, 2.0, 3]
        default: 2.0

# No type specified - mixed values should work
type_enum_no_type_mixed: ## Test enum without type allows mixed values
  script: echo "value={value}"
  params:
    optional:
      - value: '-v, --value'
        values: [1, text, 3.3]
        default: 1

# Invalid typed enum - int type with string value (should fail at activation)
invalid_typed_enum_int_string: ## Invalid: int enum with string value
  script: echo "platform={platform}"
  params:
    required:
      - platform: '-p, --platform'
        type: int
        values: [ios, 1, 2]

# Invalid typed enum - int type with multiple invalid values
invalid_typed_enum_int_multi: ## Invalid: int enum with string and double
  script: echo "platform={platform}"
  params:
    required:
      - platform:
        type: int
        values: [ios, 1, 2.2]

# Invalid typed enum - int default is string
invalid_typed_enum_int_default: ## Invalid: int enum with string default
  script: echo "level={level}"
  params:
    required:
      - level: '-l, --level'
        type: int
        values: [1, 2, 3]
        default: text
